openapi: 3.0.0
info:
  title: Minha API REST
  version: 0.1

servers:
  - url: http://localhost:3000/

tags:
  - name: usuarios

paths:
  /usuarios:
    post:
      tags:
        - usuarios
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        201:
          description: Usuário criado
        422:
          description: Email e senha obrigatórios

  /usuarios/login:
    post:
      tags:
        - usuarios
      summary: Realiza login e gera token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - senha
              properties:
                usuario:
                  type: string
                senha:
                  type: string
      responses:
        200:
          description: Token gerado
        401:
          description: Credenciais inválidas

  /usuarios/renovar:
    post:
      tags:
        - usuarios
      summary: Renova o token JWT
      security:
        - JWTAuth: []
      responses:
        200:
          description: Token renovado
        401:
          description: Token inválido

  /usuarios/{id}:
    delete:
      tags:
        - usuarios
      summary: Remove um usuário
      security:
        - JWTAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Removido

components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: authorization

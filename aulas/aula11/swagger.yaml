openapi: 3.1.1
info:
  title: Minha API
  description: Projeto de uma API REST desenvolvida com Expressjs
  version: 0.1.0
servers:
  - url: http://localhost:3000/
    description: Ambiente de Desenvolvimento
tags:
  - tarefas
paths:
  /tarefas:
    get:
      summary: Lista todas as tarefas
      tags:
        - tarefas
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfTarefas'
    post:
      summary: Insere uma tarefa
      tags:
        - tarefas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: "Estudar Swagger"
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        422:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro422"
        500:
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/erro500"
  /tarefas/id:
    get:
      summary: Busca uma tarefa pelo ID
      tags:
        - tarefas
      parameters:
        - in: path
          name: tarefaId
          required: true
          schema:
            type: string
      responses:
        200:
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Tarefa"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro400"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro404"
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro500"
    put:
      security:
        - JWTAuth: []
      summary: Altera uma tarefa
      tags:
        - tarefas
      parameters:
        - in: path
          name: tarefaId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                concluida:
                  type: boolean
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarefa"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro400"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro404"
        422:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro422"
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro500"
    delete:
      summary: Apaga uma tarefa
      tags:
        - tarefas
      parameters:
        - in: path
          name: tarefaId
          required: true
          schema:
            type: string
      responses:
        204:
          content:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro400"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro404"
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/erro500"
components:
  schemas:
    Tarefa:
      type: object
      properties:
        _id:
          type: string
        nome:
          type: string
        concluida:
          type: boolean
    ArrayOfTarefas:
      type: array
      items:
        $ref: "#/components/schemas/Tarefa"
    erro400:
      type: object
      properties:
        msg:
          type: string
          example: "ID Invalido"
    erro404:
      type: object
      properties:
        msg:
          type: string
          example: "Tarefa nao encontrada"
    erro422:
      type: object
      properties:
        msg:
          type: string
          example: "Nome e obrigatorio"
    erro500:
      type: object
      properties:
        msg:
          type: string
          example: "Erro interno na API"
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorizaton